<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<style>
/* ── Theme tokens ──────────────────────────────────────────
   Light is the default; html.dark overrides via custom props.
   The class lives on <html> (not <body>) so the dark variables
   also apply to the <html> element itself – otherwise html's
   background would always read :root's light value and show
   through the body in scrollbar gutters / edge areas.
   Toggle from Java with setDarkMode(true/false).
   ────────────────────────────────────────────────────────── */
:root {
    --color-bg:            #F5F6FA;
    --color-fg:            #212121;
    --color-fg-muted:      #616161;
    --color-fg-subtle:     #9E9E9E;
    --color-border:        #E0E0E0;
    --color-border-muted:  #EEEEEE;

    --color-user-bg:       #E3F2FD;
    --color-user-border:   #BBDEFB;
    --color-user-fg:       #4A90D9;

    --color-ai-bg:         #FFFFFF;
    --color-ai-border:     #E0E0E0;
    --color-ai-fg:         #2E7D32;

    --color-tool-bg:       #FFF8E1;
    --color-tool-border:   #FFE0B2;
    --color-tool-fg:       #E67E22;

    --color-partial-bg:    #F5F5F5;
    --color-partial-border:#EEEEEE;
    --color-partial-fg:    #757575;

    --color-error-bg:      #FFEBEE;
    --color-error-border:  #FFCDD2;
    --color-error-fg:      #D32F2F;

    --color-code-bg:       #F0F0F0;
    --color-pre-bg:        #263238;
    --color-pre-fg:        #ECEFF1;

    --color-table-border:  #E0E0E0;
    --color-table-head-bg: #F5F5F5;

    --color-link:          #4A90D9;
    --color-quote-border:  #BDBDBD;

    --color-btn-border:        #E0E0E0;
    --color-btn-fg:            #757575;
    --color-btn-hover-bg:      #F0F0F0;
    --color-btn-hover-border:  #BDBDBD;

    --color-thinking-bg:       #F9F7F2;
    --color-thinking-border:   #E8E2D0;
    --color-thinking-fg:       #6B5B3A;
    --color-thinking-accent:   #C4960C;
    --color-thinking-content-bg: #F5F3EE;

    --shadow-bubble: 0 1px 4px rgba(0,0,0,0.06);
}

/* Dark palette – tuned to harmonise with AtlantaFX NordDark
   so the WebView blends into the dark JavaFX shell. */
html.dark {
    --color-bg:            #2E3440;
    --color-fg:            #ECEFF4;
    --color-fg-muted:      #D8DEE9;
    --color-fg-subtle:     #8390A1;
    --color-border:        #434C5E;
    --color-border-muted:  #3B4252;

    --color-user-bg:       #3B4756;
    --color-user-border:   #4C566A;
    --color-user-fg:       #88C0D0;

    --color-ai-bg:         #3B4252;
    --color-ai-border:     #434C5E;
    --color-ai-fg:         #A3BE8C;

    --color-tool-bg:       #3F3A2C;
    --color-tool-border:   #5E5736;
    --color-tool-fg:       #EBCB8B;

    --color-partial-bg:    #353B47;
    --color-partial-border:#3B4252;
    --color-partial-fg:    #8390A1;

    --color-error-bg:      #3F2E32;
    --color-error-border:  #5C3B40;
    --color-error-fg:      #BF616A;

    --color-code-bg:       #434C5E;
    --color-pre-bg:        #1F242E;
    --color-pre-fg:        #ECEFF4;

    --color-table-border:  #434C5E;
    --color-table-head-bg: #3B4252;

    --color-link:          #88C0D0;
    --color-quote-border:  #4C566A;

    --color-btn-border:        #434C5E;
    --color-btn-fg:            #8390A1;
    --color-btn-hover-bg:      #434C5E;
    --color-btn-hover-border:  #4C566A;

    --color-thinking-bg:       #33392E;
    --color-thinking-border:   #4A5240;
    --color-thinking-fg:       #B8B08A;
    --color-thinking-accent:   #EBCB8B;
    --color-thinking-content-bg: #2F3529;

    --shadow-bubble: 0 1px 4px rgba(0,0,0,0.35);
}

/* ── Reset & base ──────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    height: 100%;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    color: var(--color-fg);
    background: var(--color-bg);
}

body {
    padding: 8px;
    overflow-y: auto;
    overflow-x: hidden;
}

/* ── Message bubble (shared) ───────────────────────────── */
.message {
    border-radius: 10px;
    border: 1px solid;
    padding: 12px 16px;
    margin-bottom: 8px;
    box-shadow: var(--shadow-bubble);
    position: relative;
}

/* ── Per-type colours ──────────────────────────────────── */
.message.user    { background: var(--color-user-bg);    border-color: var(--color-user-border); }
.message.ai      { background: var(--color-ai-bg);      border-color: var(--color-ai-border); }
.message.tool    { background: var(--color-tool-bg);    border-color: var(--color-tool-border); }
.message.partial { background: var(--color-partial-bg); border-color: var(--color-partial-border); }
.message.error   { background: var(--color-error-bg);   border-color: var(--color-error-border); }

/* ── Header row (type label + copy btn) ────────────────── */
.msg-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
}

.msg-type {
    font-weight: bold;
    font-size: 12px;
}

.msg-type.user    { color: var(--color-user-fg); }
.msg-type.ai      { color: var(--color-ai-fg); }
.msg-type.tool    { color: var(--color-tool-fg); }
.msg-type.partial { color: var(--color-partial-fg); font-style: italic; }
.msg-type.error   { color: var(--color-error-fg); }

.btn-copy {
    background: transparent;
    border: 1px solid var(--color-btn-border);
    border-radius: 4px;
    font-size: 11px;
    color: var(--color-btn-fg);
    padding: 2px 8px;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.15s, background 0.15s;
}
.btn-copy:hover {
    opacity: 1;
    background: var(--color-btn-hover-bg);
    border-color: var(--color-btn-hover-border);
}

/* ── Message body ──────────────────────────────────────── */
.msg-body {
    line-height: 1.5;
    word-wrap: break-word;
    overflow-wrap: break-word;
}

.msg-body.user-body {
    font-weight: bold;
    text-align: right;
}

/* ── Markdown content styles ───────────────────────────── */
.msg-body h1 { font-size: 1.5em; margin: 0.4em 0; }
.msg-body h2 { font-size: 1.3em; margin: 0.4em 0; }
.msg-body h3 { font-size: 1.15em; margin: 0.3em 0; }
.msg-body h4, .msg-body h5, .msg-body h6 { font-size: 1em; margin: 0.3em 0; }

.msg-body p { margin: 0.4em 0; }

.msg-body ul, .msg-body ol {
    margin: 0.4em 0;
    padding-left: 1.6em;
}

.msg-body blockquote {
    border-left: 3px solid var(--color-quote-border);
    padding-left: 12px;
    color: var(--color-fg-muted);
    margin: 0.4em 0;
}

.msg-body pre {
    background: var(--color-pre-bg);
    color: var(--color-pre-fg);
    border-radius: 6px;
    padding: 10px 12px;
    overflow-x: auto;
    margin: 0.5em 0;
    font-size: 13px;
    line-height: 1.45;
}

.msg-body code {
    font-family: "Cascadia Code", "Fira Code", "Consolas", monospace;
    font-size: 0.92em;
}

.msg-body :not(pre) > code {
    background: var(--color-code-bg);
    border-radius: 3px;
    padding: 1px 5px;
}

.msg-body table {
    border-collapse: collapse;
    margin: 0.5em 0;
    width: 100%;
}

.msg-body th, .msg-body td {
    border: 1px solid var(--color-table-border);
    padding: 6px 10px;
    text-align: left;
}

.msg-body th {
    background: var(--color-table-head-bg);
    font-weight: 600;
}

.msg-body a {
    color: var(--color-link);
    text-decoration: none;
}
.msg-body a:hover { text-decoration: underline; }

.msg-body img { max-width: 100%; border-radius: 4px; }

/* ── AI message: token statistics (collapsible) ─────────── */
.stats-toggle {
    cursor: pointer;
    user-select: none;
    font-size: 12px;
    color: var(--color-fg-muted);
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px solid var(--color-border-muted);
    font-weight: 600;
}
.stats-toggle::before { content: "▸ "; }
.stats-toggle.open::before { content: "▾ "; }

.stats-body {
    display: none;
    font-size: 12px;
    color: var(--color-fg-muted);
    margin-top: 6px;
    line-height: 1.5;
}
.stats-body.open { display: block; }
.stats-body .stats-row { margin: 2px 0; }
.stats-body .stats-label { color: var(--color-fg-subtle); margin-right: 6px; }

/* ── Tool message collapsible ──────────────────────────── */
.tool-toggle {
    cursor: pointer;
    user-select: none;
    font-size: 12px;
    color: var(--color-tool-fg);
    font-weight: bold;
    margin-bottom: 4px;
}
.tool-toggle::before { content: "▸ "; }
.tool-toggle.open::before { content: "▾ "; }

.tool-body {
    display: none;
    margin-top: 4px;
}
.tool-body.open { display: block; }

/* ── Thinking message (collapsible, tool-call style) ───── */
.message.thinking {
    background: var(--color-thinking-bg);
    border-color: var(--color-thinking-border);
    padding: 0;
}

.thinking-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
    border-radius: 10px;
}
.thinking-header:hover {
    background: rgba(128, 128, 128, 0.06);
}

.thinking-icon {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-thinking-accent);
}
.thinking-icon svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
}

.thinking-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--color-thinking-fg);
    flex: 1;
}

.thinking-chevron {
    font-size: 11px;
    color: var(--color-thinking-fg);
    opacity: 0.6;
    transition: transform 0.2s;
}
.thinking-header.open .thinking-chevron {
    transform: rotate(90deg);
}

.thinking-content {
    display: none;
    padding: 0 14px 12px 40px;
    border-top: 1px solid var(--color-thinking-border);
    margin: 0 8px;
}
.thinking-content.open {
    display: block;
}

.thinking-content .msg-body {
    font-size: 13px;
    color: var(--color-fg-muted);
    line-height: 1.55;
}

.message.thinking.streaming .thinking-content .msg-body::after {
    content: "▌";
    animation: blink 0.8s step-end infinite;
}

@keyframes thinking-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}
.message.thinking.streaming .thinking-title {
    animation: thinking-pulse 1.8s ease-in-out infinite;
}

/* ── Partial message animation ─────────────────────────── */
.partial .msg-body::after {
    content: "▌";
    animation: blink 0.8s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="messages"></div>

<script>
const container = document.getElementById('messages');

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function createMessageElement(id, type, labelText, bodyHtml) {
    const div = document.createElement('div');
    div.className = 'message ' + type;
    div.id = 'msg-' + id;

    const header = document.createElement('div');
    header.className = 'msg-header';

    const labelSpan = document.createElement('span');
    labelSpan.className = 'msg-type ' + type;
    labelSpan.textContent = labelText;

    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn-copy';
    copyBtn.textContent = 'Copy';
    copyBtn.onclick = function() { javaBridge.copyMessage(id); };

    header.appendChild(labelSpan);
    header.appendChild(copyBtn);

    const body = document.createElement('div');
    body.className = 'msg-body' + (type === 'user' ? ' user-body' : '');
    body.innerHTML = bodyHtml;

    div.appendChild(header);
    div.appendChild(body);
    return div;
}

function addMessage(id, type, typeLabel, bodyHtml) {
    const el = createMessageElement(id, type, typeLabel, bodyHtml);
    container.appendChild(el);
    scrollToBottom();
}

function addAiMessage(id, typeLabel, bodyHtml, inputTokens, outputTokens, totalTokens) {
    const div = document.createElement('div');
    div.className = 'message ai';
    div.id = 'msg-' + id;

    const header = document.createElement('div');
    header.className = 'msg-header';

    const label = document.createElement('span');
    label.className = 'msg-type ai';
    label.textContent = typeLabel;

    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn-copy';
    copyBtn.textContent = 'Copy';
    copyBtn.onclick = function() { javaBridge.copyMessage(id); };

    header.appendChild(label);
    header.appendChild(copyBtn);

    const body = document.createElement('div');
    body.className = 'msg-body';
    body.innerHTML = bodyHtml;

    const statsToggle = document.createElement('div');
    statsToggle.className = 'stats-toggle';
    statsToggle.textContent = 'Token usage';

    const statsBody = document.createElement('div');
    statsBody.className = 'stats-body';
    statsBody.innerHTML =
        '<div class="stats-row"><span class="stats-label">Input</span>' + inputTokens + '</div>' +
        '<div class="stats-row"><span class="stats-label">Output</span>' + outputTokens + '</div>' +
        '<div class="stats-row"><span class="stats-label">Total</span>' + totalTokens + '</div>';

    statsToggle.onclick = function() {
        statsToggle.classList.toggle('open');
        statsBody.classList.toggle('open');
    };

    div.appendChild(header);
    div.appendChild(body);
    div.appendChild(statsToggle);
    div.appendChild(statsBody);
    container.appendChild(div);
    //scrollToBottom();
}

function addToolMessage(id, typeLabel, summaryText, bodyHtml) {
    const div = document.createElement('div');
    div.className = 'message tool';
    div.id = 'msg-' + id;

    const header = document.createElement('div');
    header.className = 'msg-header';

    const label = document.createElement('span');
    label.className = 'msg-type tool';
    label.textContent = typeLabel;

    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn-copy';
    copyBtn.textContent = 'Copy';
    copyBtn.onclick = function() { javaBridge.copyMessage(id); };

    header.appendChild(label);
    header.appendChild(copyBtn);

    const toggle = document.createElement('div');
    toggle.className = 'tool-toggle';
    toggle.textContent = summaryText;
    toggle.onclick = function() {
        toggle.classList.toggle('open');
        bodyDiv.classList.toggle('open');
    };

    const bodyDiv = document.createElement('div');
    bodyDiv.className = 'tool-body msg-body';
    bodyDiv.innerHTML = bodyHtml;

    div.appendChild(header);
    div.appendChild(toggle);
    div.appendChild(bodyDiv);
    container.appendChild(div);
    scrollToBottom();
}

var BULB_SVG = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">'
    + '<path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/>'
    + '</svg>';

function setPartialThinkingMessage(bodyHtml, id) {
    var elId = 'msg-partial-thinking-' + id;
    var el = document.getElementById(elId);

    if (!el) {
        el = document.createElement('div');
        el.className = 'message thinking streaming';
        el.id = elId;

        var header = document.createElement('div');
        header.className = 'thinking-header open';

        var icon = document.createElement('span');
        icon.className = 'thinking-icon';
        icon.innerHTML = BULB_SVG;

        var title = document.createElement('span');
        title.className = 'thinking-title';
        title.textContent = 'Thinking\u2026';

        var chevron = document.createElement('span');
        chevron.className = 'thinking-chevron';
        chevron.textContent = '\u25B8';

        header.appendChild(icon);
        header.appendChild(title);
        header.appendChild(chevron);

        var content = document.createElement('div');
        content.className = 'thinking-content open';

        var body = document.createElement('div');
        body.className = 'msg-body';
        content.appendChild(body);

        header.onclick = function() {
            header.classList.toggle('open');
            content.classList.toggle('open');
        };

        el.appendChild(header);
        el.appendChild(content);
        container.appendChild(el);
    }

    el.querySelector('.thinking-content .msg-body').innerHTML = bodyHtml;
}

function setPartialMessage(bodyHtml) {
    let el = document.getElementById('msg-partial');
    if (!el) {
        el = createMessageElement('partial', 'partial', 'LLM', '');
        container.appendChild(el);
    }
    el.querySelector('.msg-body').innerHTML = bodyHtml;
    //scrollToBottom();
}

function removePartialMessage() {
    const el = document.getElementById('msg-partial');
    if (el) el.remove();
}

function thinkingFinished(id) {
    var el = document.getElementById('msg-partial-thinking-' + id);
    if (!el) return;

    el.classList.remove('streaming');

    var title = el.querySelector('.thinking-title');
    if (title) title.textContent = 'Thought for a moment';

    var header = el.querySelector('.thinking-header');
    var content = el.querySelector('.thinking-content');
    if (header) header.classList.remove('open');
    if (content) content.classList.remove('open');
}

function clearMessages() {
    container.innerHTML = '';
}

function setDarkMode(enabled) {
    document.documentElement.classList.toggle('dark', !!enabled);
}

function scrollToBottom() {
    window.scrollTo(0, document.body.scrollHeight);
}

document.addEventListener('click', function(e) {
    const a = e.target.closest('a');
    if (a && a.href && !a.href.startsWith('javascript')) {
        e.preventDefault();
        javaBridge.openLink(a.href);
    }
});
</script>
</body>
</html>
